services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Fourni par Holberton (dépôt copié dans external/product-api).
  # Ne pas modifier le contenu de ce dossier.
  # Nom de service = nom DNS interne : les autres conteneurs l'atteignent
  # sur http://external-products-api:5000 (port INTERNE, pas le port publié).
  external-products-api:
    build: ./external/product-api
    container_name: hbntory-products-api
    environment:
      HBN_PRODUCTS_PORT: "5000"
      HBN_PRODUCTS_LATENCY_MS: "0"
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 5

  backoffice:
    build: ./backoffice
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      external-products-api:
        condition: service_healthy
    volumes:
      - ./backoffice:/app          # hot-reload en dev
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/login')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mcp-server:
    build: ./product_mcp_server
    env_file: .env
    environment:
      PRODUCT_API_URL: http://external-products-api:5000
    ports:
      - "8001:8001"
    depends_on:
      external-products-api:
        condition: service_healthy
    volumes:
      - ./product_mcp_server:/app
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8001), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  stock-mcp-server:
    build: ./stock_mcp_server
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
      backoffice:
        condition: service_healthy
    volumes:
      - ./stock_mcp_server:/app
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8003), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ai-service:
    build: ./ai_service
    env_file: .env
    environment:
      PRODUCT_MCP_URL: http://mcp-server:8001/mcp
      STOCK_MCP_URL: http://stock-mcp-server:8003/mcp
    ports:
      - "8002:8002"
    depends_on:
      mcp-server:
        condition: service_healthy
      stock-mcp-server:
        condition: service_healthy
    volumes:
      - ./ai_service:/app
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  client-web:
    build:
      context: ./client-web-interface
      dockerfile: dockerfile
    ports:
      - "8080:80"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
