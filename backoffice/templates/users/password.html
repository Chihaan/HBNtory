<!doctype html>
<title>Nouveau mot de passe</title>
<h1>Changer le mot de l'utilisateur</h1>
{% for message in get_flashed_messages() %}
    <p class="error">{{ message }}</p>
{% endfor %}
<form method="post">
    {{ form.hidden_tag() }}
    {{ form.password.label }} {{ form.password() }}
    <button type="submit">Modifier</button>
</form>
