{% extends "base.html" %}
{% block title %}Mot de passe - HBNtory{% endblock %}
{% block content %}
<h1>Changer le mot de passe</h1>
<p class="subtitle">Réinitialisation par l'administrateur</p>
<div class="form-card">
    <form method="post">
        {{ form.hidden_tag() }}
        {{ form.password.label }}
        {{ form.password() }}
        <button type="submit" class="btn">Modifier</button>
    </form>
</div>
<p style="margin-top:16px">
    <a href="{{ url_for('users.list_users_view') }}">← Retour</a>
</p>
{% endblock %}
