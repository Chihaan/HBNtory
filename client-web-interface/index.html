<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed1944">
    <title>HBNtory · Client assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="background-logo background-logo-left" src="seahorse.png" alt="" aria-hidden="true">
    <img class="background-logo background-logo-right" src="seahorse.png" alt="" aria-hidden="true">

    <main class="app-shell">
        <header class="brand">
            <img src="seahorse.png" alt="Logo Holberton" class="brand-logo">
            <div>
                <p class="brand-name">HBNtory</p>
                <p class="brand-subtitle">Client assistant</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activer le thème sombre" aria-pressed="false">
                <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
                <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path></svg>
                <span class="sr-only">Changer le thème</span>
            </button>
        </header>

        <section class="assistant" aria-labelledby="page-title">
            <div class="intro">
                <img src="seahorse.png" alt="" aria-hidden="true" class="intro-logo">
                <h1 id="page-title">Comment puis-je vous aider&nbsp;?</h1>
                <p>Interrogez vos produits, vos stocks et vos agences.</p>
            </div>

            <form id="query-form" class="query-form">
                <label class="sr-only" for="question">Votre question</label>
                <textarea id="question" rows="1" placeholder="Ex. Où puis-je trouver le produit 123 ?" autocomplete="off" required></textarea>
                <button id="submit-button" type="submit" aria-label="Envoyer la question">
                    <span>Envoyer</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-5 16-3.5-6.5L4 12Z"></path><path d="m11.5 13.5 4-4"></path></svg>
                </button>
            </form>
            <p class="keyboard-hint">Appuyez sur <kbd>Entrée</kbd> pour envoyer · <kbd>Maj</kbd> + <kbd>Entrée</kbd> pour aller à la ligne</p>

            <section id="response-container" class="response-container" aria-live="polite" aria-label="Réponse de l’assistant">
                <div id="empty-state" class="empty-state">
                    <span class="sparkle">✦</span>
                    <p>Votre réponse apparaîtra ici.</p>
                </div>
                <div id="conversation" class="conversation" hidden></div>
            </section>

            <div class="suggestions" aria-label="Questions suggérées">
                <button type="button" data-question="Dans quelle agence puis-je trouver le produit 123 ?">Trouver un produit</button>
                <button type="button" data-question="Donne-moi les détails du produit 123.">Détails d’un produit</button>
                <button type="button" data-question="Quels produits sont disponibles dans l’agence de Paris ?">Stock à Paris</button>
            </div>
        </section>

        <footer>HBNtory · Propulsé par le Client assistant</footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
