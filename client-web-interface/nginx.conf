server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ai-service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Budget croissant de bout en bout :
        #   AI Service 60 s  <  Nginx 75 s  <  navigateur 90 s
        # Le service IA coupe donc toujours en premier et renvoie un 504
        # JSON lisible, au lieu de la page d'erreur brute de Nginx.
        # Voir ai_service/agent.py (REQUEST_BUDGET_SECONDS) et script.js.
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # Prêt pour le futur endpoint FastAPI /ws :
    # renseigner ensuite /api/ws dans la meta cwi-websocket-url du HTML.
    location = /api/ws {
        proxy_pass http://ai-service:8002/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
